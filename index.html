<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">
<title>Pokladna — Palety Vít</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#e8e8ed; --bg4:#d8d8dd;
  --border:#cccccc; --white:#111111; --dim:#888888; --muted:#bbbbbb;
  --official:#2980b9; --official-bg:#e8f0f8; --official-dim:#b0cce0;
  --unofficial:#e67e22; --unofficial-bg:#fdf0e8; --unofficial-dim:#f0c898;
  --green:#27ae60; --red:#e05555; --yellow:#e6a800;
  --hh:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--white);font-family:'Barlow',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:90px;touch-action:manipulation}

/* LOGIN SCREEN */
.login-ov{display:none;position:fixed;inset:0;background:#0a0a0a;z-index:400;align-items:center;justify-content:center;padding:20px}
.login-ov.open{display:flex}
.login-box{background:#ffffff;border-radius:16px;width:100%;max-width:340px;padding:26px 22px}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:5px;text-transform:uppercase;text-align:center;margin-bottom:2px}
.login-sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:22px}
.login-err{color:var(--red);font-size:12px;margin:-6px 0 14px;display:none}

/* HEADER */
.header{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;flex-direction:column;line-height:1}
.logo-top,.logo-bot{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;letter-spacing:6px;text-transform:uppercase;color:var(--white)}
.logo-bot{display:flex;gap:14px}
.logo-sep{height:1px;background:rgba(255,255,255,.12);margin:2px 0}
.hdate{text-align:right;font-size:11px;color:var(--dim);line-height:1.6}
.who-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 10px 5px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;color:var(--white)}
.who-chip span.ico{color:var(--dim);font-size:13px}

/* BALANCE CARDS */
.balance-wrap{padding:12px;display:grid;grid-template-columns:1fr;gap:8px}
.bcard{border-radius:12px;padding:14px;border:1px solid}
.bcard.official{background:var(--official-bg);border-color:var(--official-dim)}
.bcard.unofficial{background:var(--unofficial-bg);border-color:var(--unofficial-dim)}
.bcard-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.bcard.official .bcard-lbl{color:var(--official)}
.bcard.unofficial .bcard-lbl{color:var(--unofficial)}
.bcard-amt{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;line-height:1}
.bcard.official .bcard-amt{color:var(--official)}
.bcard.unofficial .bcard-amt{color:var(--unofficial)}
.bcard-sub{font-size:11px;color:var(--dim);margin-top:5px}

/* NEOFICIALNI STRIP */
.unof-strip{margin:0 12px 10px;background:var(--unofficial-bg);border:1px solid var(--unofficial-dim);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.unof-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--unofficial)}

/* TODAY STRIP */
.today-strip{margin:0 12px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.today-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.today-vals{display:flex;gap:16px}
.today-item{text-align:right}
.today-item-lbl{font-size:10px;color:var(--dim)}
.today-item-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800}
.today-item-val.plus{color:var(--green)}
.today-item-val.minus{color:var(--red)}

/* SECTION LABEL */
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);padding:8px 12px 4px}

/* TRANSACTION LIST */
.txlist{padding:0 12px;display:flex;flex-direction:column;gap:6px}
.txitem{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.txitem:active{background:var(--bg3)}
.txitem-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.txitem-icon.income{background:#d4edda}
.txitem-icon.expense{background:#fde8e8}
.txitem-info{flex:1;min-width:0}
.txitem-cat{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txitem-meta{font-size:11px;color:var(--dim);margin-top:1px}
.txitem-right{text-align:right;flex-shrink:0}
.txitem-amt{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800}
.txitem-amt.plus{color:var(--green)}
.txitem-amt.minus{color:var(--red)}
.txitem-kasa{font-size:10px;margin-top:2px;font-weight:700;letter-spacing:1px}
.txitem-kasa.official{color:var(--official)}
.txitem-kasa.unofficial{color:var(--unofficial)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

/* BOTTOM BAR */
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;z-index:100}
.btn{padding:13px;border:none;border-radius:9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .12s}
.bico{background:var(--bg3);color:var(--dim);border:1px solid var(--border);width:50px;font-size:18px;flex-shrink:0}
.bico:active{background:var(--border)}
.badd{flex:1;background:#111111;color:#ffffff;font-size:16px}
.badd:active{background:#ccc;transform:scale(.98)}

/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:#ffffff;border-top:2px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:20px 16px 40px;max-height:92vh;overflow-y:auto}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mtit{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.mclose{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:2px 4px}

/* FORM */
.fgrp{margin-bottom:14px}
.flbl{display:block;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.finp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--white);font-family:'Barlow',sans-serif;font-size:16px;padding:12px 14px;outline:none;transition:border-color .12s;-moz-appearance:textfield}
.finp::-webkit-outer-spin-button,.finp::-webkit-inner-spin-button{-webkit-appearance:none}
.finp:focus{border-color:var(--white)}
.finp::placeholder{color:var(--muted)}
.fstatic{padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-align:center}

.seg{display:flex;gap:6px}
.seg-btn{flex:1;padding:11px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);cursor:pointer;text-align:center;transition:all .12s}
.seg-btn.on-income{background:#d4edda;color:#1a7a30;border-color:var(--green)}
.seg-btn.on-expense{background:#fde8e8;color:#c0392b;border-color:var(--red)}
.seg-btn.on-official{background:var(--official-bg);color:var(--official);border-color:var(--official)}
.seg-btn.on-unofficial{background:var(--unofficial-bg);color:var(--unofficial);border-color:var(--unofficial)}
.seg-btn.on-person{background:var(--bg4);color:var(--white);border-color:var(--white)}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.cat-btn{padding:10px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;text-align:center;transition:all .12s}
.cat-btn.on{background:var(--bg4);color:var(--white);border-color:var(--white)}

.bok{width:100%;padding:15px;background:#111111;color:#ffffff;border:none;border-radius:9px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:4px}
.bok:active{opacity:.85}
.bok:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.bdel{width:100%;padding:15px;background:#2a1414;color:var(--red);border:1px solid #4a2a2a;border-radius:9px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:8px}
.bdel:active{opacity:.85}

/* STATS SCREEN */
.screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto;padding-bottom:90px}
.screen.open{display:block}
.screen-hd{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.screen-tit{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:4px;text-transform:uppercase}
.sclose{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:4px 8px}

.ptabs{display:flex;gap:6px;padding:14px 12px 4px}
.ptab{flex:1;padding:9px 4px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);cursor:pointer;text-align:center;transition:all .12s}
.ptab.on{background:var(--white);color:#1a1a1a;border-color:var(--white)}

.scards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 12px}
.sc.wide{grid-column:1/-1}
.sclbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.scval{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;line-height:1}
.scsub{font-size:11px;color:var(--dim);margin-top:4px}

.catlist{padding:0 12px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.catrow{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.catrow-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;min-width:110px}
.catrow-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.catrow-fill{height:100%;background:var(--white);border-radius:2px}
.catrow-amt{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;min-width:70px;text-align:right}

/* TOAST */
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:var(--green);color:#ffffff;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;padding:11px 22px;border-radius:8px;z-index:300;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1}

/* HISTORY SCREEN */
.hlist{display:flex;flex-direction:column;gap:7px;padding:10px 12px}
.hitem{background:#ffffff;border-radius:8px;padding:11px 13px;border-left:3px solid var(--border);cursor:pointer}
.hitem:active{background:var(--bg3)}
.hitem.income{border-left-color:var(--green)}
.hitem.expense{border-left-color:var(--red)}
.hhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hdate2{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--dim)}
.hamt{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800}
.hamt.plus{color:var(--green)}
.hamt.minus{color:var(--red)}
.hdet2{font-size:11px;color:var(--dim);line-height:1.6}
.hnote2{font-size:11px;color:var(--dim);font-style:italic;margin-top:3px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-ov open" id="login-screen">
  <div class="login-box">
    <div class="login-logo">POKLADNA</div>
    <div class="login-sub">Palety Vít</div>
    <div class="fgrp">
      <label class="flbl">E-mail</label>
      <input class="finp" type="email" id="login-email" placeholder="e-mail" autocomplete="username">
    </div>
    <div class="fgrp">
      <label class="flbl">Heslo</label>
      <input class="finp" type="password" id="login-pass" placeholder="heslo" autocomplete="current-password">
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="bok" onclick="submitLogin()">Přihlásit se</button>
  </div>
</div>

<div id="app-root" style="display:none">

<div class="header">
  <div style="display:flex;align-items:center;gap:14px">
    <div style="display:flex;flex-direction:column;line-height:1">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;letter-spacing:5px;color:var(--white)">PALETY</div>
      <div style="display:flex;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;letter-spacing:5px;color:var(--white)"><span>VÍ</span><span>T</span></div>
    </div>
    <div style="width:1px;height:32px;background:var(--border)"></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:4px;text-transform:uppercase;color:var(--dim)">POKLADNA</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
    <div class="who-chip" id="who-chip" onclick="confirmLogout()"><span id="who-name">—</span><span class="ico">⏻</span></div>
    <div class="hdate" id="hdate"></div>
  </div>
</div>

<div class="balance-wrap">
  <div class="bcard official" style="background:#e8f5ec;border-color:#a8d8b0">
    <div class="bcard-lbl" style="color:var(--green)">Zůstatek</div>
    <div class="bcard-amt" id="bal-total" style="color:var(--green)">—</div>
    <div class="bcard-sub" id="bal-total-sub">načítám…</div>
  </div>
</div>

<div class="unof-strip">
  <div class="unof-lbl">Neoficiální od ukotvení</div>
  <div class="today-vals">
    <div class="today-item">
      <div class="today-item-lbl">Příjmy</div>
      <div class="today-item-val plus" id="unof-in">—</div>
    </div>
    <div class="today-item">
      <div class="today-item-lbl">Výdaje</div>
      <div class="today-item-val minus" id="unof-out">—</div>
    </div>
  </div>
</div>

<div class="today-strip">
  <div class="today-lbl">Dnes</div>
  <div class="today-vals">
    <div class="today-item">
      <div class="today-item-lbl">Příjmy</div>
      <div class="today-item-val plus" id="today-in">0 Kč</div>
    </div>
    <div class="today-item">
      <div class="today-item-lbl">Výdaje</div>
      <div class="today-item-val minus" id="today-out">0 Kč</div>
    </div>
  </div>
</div>

<div class="sec-lbl">Poslední transakce</div>
<div class="txlist" id="txlist"></div>

<div class="bbar">
  <button class="btn bico" onclick="openHistory()">☰</button>
  <button class="btn badd" onclick="openAdd()">+ Přidat transakci</button>
  <button class="btn bico" onclick="openStats()">📊</button>
</div>

<!-- ADD MODAL -->
<div class="ov" id="ov-add">
  <div class="modal">
    <div class="mhd"><div class="mtit">Nová transakce</div><button class="mclose" onclick="closeOv('ov-add')">✕</button></div>

    <div class="fgrp">
      <label class="flbl">Typ</label>
      <div class="seg">
        <button class="seg-btn on-income" id="typ-income" onclick="setTyp('income')">↑ Příjem</button>
        <button class="seg-btn" id="typ-expense" onclick="setTyp('expense')">↓ Výdaj</button>
      </div>
    </div>

    <div class="fgrp" id="fgrp-kasa">
      <label class="flbl">Kasa</label>
      <div class="seg">
        <button class="seg-btn on-official" id="kas-official" onclick="setKasa('official')">🔵 Oficiální</button>
        <button class="seg-btn" id="kas-unofficial" onclick="setKasa('unofficial')">🔴 Neoficiální</button>
      </div>
    </div>

    <div class="fgrp">
      <label class="flbl">Kdo</label>
      <div class="fstatic" id="add-who-display">—</div>
    </div>

    <div class="fgrp">
      <label class="flbl">Kategorie</label>
      <div class="cats" id="cats"></div>
    </div>

    <div class="fgrp">
      <label class="flbl">Částka (Kč)</label>
      <input class="finp" type="number" id="finp-amt" placeholder="0" inputmode="numeric" min="0" oninput="validateForm()">
    </div>

    <div class="fgrp">
      <label class="flbl">Poznámka</label>
      <input class="finp" type="text" id="finp-note" placeholder="Nepovinná poznámka…" maxlength="120">
    </div>

    <button class="bok" id="bok-add" onclick="saveTx()" disabled>✓ Uložit transakci</button>
  </div>
</div>

<!-- EDIT / DETAIL MODAL -->
<div class="ov" id="ov-edit">
  <div class="modal">
    <div class="mhd"><div class="mtit">Detail transakce</div><button class="mclose" onclick="closeOv('ov-edit')">✕</button></div>

    <div class="fgrp">
      <label class="flbl">Datum a čas</label>
      <div class="fstatic" id="edit-datetime" style="color:var(--dim)">—</div>
    </div>

    <div class="fgrp">
      <label class="flbl">Typ</label>
      <div class="seg">
        <button class="seg-btn on-income" id="etyp-income" onclick="setETyp('income')">↑ Příjem</button>
        <button class="seg-btn" id="etyp-expense" onclick="setETyp('expense')">↓ Výdaj</button>
      </div>
    </div>

    <div class="fgrp">
      <label class="flbl">Kasa</label>
      <div class="seg">
        <button class="seg-btn on-official" id="ekas-official" onclick="setEKasa('official')">🔵 Oficiální</button>
        <button class="seg-btn" id="ekas-unofficial" onclick="setEKasa('unofficial')">🔴 Neoficiální</button>
      </div>
    </div>

    <div class="fgrp">
      <label class="flbl">Kdo</label>
      <div class="seg">
        <button class="seg-btn on-person" id="eper-lukas" onclick="setEPerson('Lukáš')">Lukáš</button>
        <button class="seg-btn" id="eper-kolega" onclick="setEPerson('Ondra')">Ondra</button>
      </div>
    </div>

    <div class="fgrp">
      <label class="flbl">Kategorie</label>
      <div class="cats" id="ecats"></div>
    </div>

    <div class="fgrp">
      <label class="flbl">Částka (Kč)</label>
      <input class="finp" type="number" id="einp-amt" inputmode="numeric" min="0" oninput="validateEditForm()">
    </div>

    <div class="fgrp">
      <label class="flbl">Poznámka</label>
      <input class="finp" type="text" id="einp-note" maxlength="120">
    </div>

    <button class="bok" id="bok-edit" onclick="saveEditTx()">✓ Uložit změny</button>
    <button class="bdel" onclick="deleteEditTx()">🗑️ Smazat transakci</button>
  </div>
</div>

<!-- HISTORY SCREEN -->
<div class="screen" id="screen-history">
  <div class="screen-hd">
    <div class="screen-tit">Historie</div>
    <button class="sclose" onclick="closeScreen('screen-history')">✕</button>
  </div>
  <div class="hlist" id="hlist"></div>
</div>

<!-- STATS SCREEN -->
<div class="screen" id="screen-stats">
  <div class="screen-hd">
    <div class="screen-tit">Statistiky</div>
    <button class="sclose" onclick="closeScreen('screen-stats')">✕</button>
  </div>
  <div class="ptabs">
    <button class="ptab on" onclick="setPeriod(0,this)">Dnes</button>
    <button class="ptab" onclick="setPeriod(7,this)">7 dní</button>
    <button class="ptab" onclick="setPeriod(30,this)">30 dní</button>
  </div>
  <div class="scards" id="scards"></div>
  <div class="sec-lbl" style="padding-top:14px">Výdaje podle kategorie</div>
  <div class="catlist" id="catlist"></div>
</div>

</div><!-- /app-root -->

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, deleteDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD60m7hSErvSuOQul3kfAjWPpGfVmyVVuM",
  authDomain: "vykup-palet.firebaseapp.com",
  projectId: "vykup-palet",
  storageBucket: "vykup-palet.firebasestorage.app",
  messagingSenderId: "264591837143",
  appId: "1:264591837143:web:5bd414b54a33a3fde26d92"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const PERSON_BY_EMAIL = {
  'lukas.vit@v-pallets.cz': 'Lukáš',
  'ondrej.vit@paletyvit.cz': 'Ondra'
};

window.saveToFirebase = async function(rec) {
  try {
    await addDoc(collection(db, "pokladna"), rec);
    return true;
  } catch(e) { console.error(e); return false; }
};

window.updateInFirebase = async function(id, fields) {
  try {
    await updateDoc(doc(db, "pokladna", id), fields);
    return true;
  } catch(e) { console.error(e); return false; }
};

window.deleteFromFirebase = async function(id) {
  try {
    await deleteDoc(doc(db, "pokladna", id));
    return true;
  } catch(e) { console.error(e); return false; }
};

window.loadAnchor = async function() {
  try {
    const snap = await getDoc(doc(db, 'pokladna_meta', 'anchor'));
    if (snap.exists()) {
      const data = snap.data();
      window._anchor = { date: data.date, official: Number(data.official) };
    } else {
      window._anchor = null;
    }
  } catch(e) { console.error('anchor fetch failed', e); window._anchor = null; }
  if (window.refreshAll) window.refreshAll();
};

let unsubscribeTx = null;

window.doLogin = async function(email, password) {
  try {
    await signInWithEmailAndPassword(auth, email, password);
    return null;
  } catch(e) {
    return e.code || 'auth-error';
  }
};

window.doLogout = function() {
  if (unsubscribeTx) { unsubscribeTx(); unsubscribeTx = null; }
  signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    window._currentPerson = PERSON_BY_EMAIL[user.email] || user.email;
    document.getElementById('login-screen').classList.remove('open');
    document.getElementById('app-root').style.display = '';
    const whoName = document.getElementById('who-name');
    if (whoName) whoName.textContent = window._currentPerson;
    window.loadAnchor();
    if (!unsubscribeTx) {
      const q = query(collection(db, "pokladna"), orderBy("ts", "desc"), limit(2000));
      unsubscribeTx = onSnapshot(q, (snapshot) => {
        const data = [];
        snapshot.forEach(d => data.push({...d.data(), _id: d.id}));
        window._txData = data;
        try { localStorage.setItem('pk_hist', JSON.stringify(data)); } catch(e) { console.error('localStorage save failed:', e); }
        if (window.refreshAll) window.refreshAll();
      });
    }
  } else {
    window._currentPerson = null;
    window._txData = null;
    document.getElementById('login-screen').classList.add('open');
    document.getElementById('app-root').style.display = 'none';
  }
});

window.submitLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!email || !pass) return;
  const err = await window.doLogin(email, pass);
  if (err) {
    errEl.textContent = 'Přihlášení se nepovedlo. Zkontroluj e-mail a heslo.';
    errEl.style.display = 'block';
  }
};

window.confirmLogout = function() {
  if (confirm('Odhlásit se z appky?')) window.doLogout();
};
</script>

<script>
const CATS_EXPENSE = ['Výkup palet','Mzda','Záloha na mzdu','Doprava','Nafta','Materiál','Jiný výdaj'];
const CATS_INCOME  = ['Vklad','Maloprodej','Platba FA cash','Jiný příjem'];
const SHEET_WRITE_URL = 'https://script.google.com/macros/s/AKfycbwkS6muxUuJXqvub_QR2NxXjy361AZuLNrVAWzIXhK4-1531aV_cQ5O121h-_PgjHOv8Q/exec';

const fd = d => (d?new Date(d):new Date()).toLocaleDateString('cs-CZ',{day:'2-digit',month:'2-digit',year:'numeric'});
const ft = d => (d?new Date(d):new Date()).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
const fkc = n => Math.round(n).toLocaleString('cs-CZ') + ' Kč';

const ck = () => document.getElementById('hdate').innerHTML = `<div>${fd()}</div><div>${ft()}</div>`;
ck(); setInterval(ck, 30000);

let formTyp = 'income', formKasa = 'official', formCat = '';
let editTyp = 'income', editKasa = 'official', editPerson = 'Lukáš', editCat = '', editTx = null;

function gh() {
  if (window._txData) return window._txData;
  try { return JSON.parse(localStorage.getItem('pk_hist') || '[]'); } catch(e) { return []; }
}

function refreshAll() {
  renderBalances();
  renderToday();
  renderRecent();
  if (document.getElementById('screen-stats').classList.contains('open')) renderStats();
  if (document.getElementById('screen-history').classList.contains('open')) renderHistory();
}
window.refreshAll = refreshAll;

function renderBalances() {
  const h = gh();
  const anchor = window._anchor;
  const bt = document.getElementById('bal-total');
  const bts = document.getElementById('bal-total-sub');
  const ui = document.getElementById('unof-in');
  const uo = document.getElementById('unof-out');
  if (!anchor) {
    if (bt) { bt.textContent = 'Čeká na ukotvení'; bt.style.fontSize = '20px'; }
    if (bts) bts.textContent = 'zůstatek zatím není ukotvený k reálnému stavu kasy';
    if (ui) ui.textContent = '—';
    if (uo) uo.textContent = '—';
    return;
  }
  let offBal = anchor.official;
  let unoffIn = 0, unoffOut = 0;
  h.forEach(t => {
    if (!t.ts || t.ts < anchor.date || t.amt === '' || t.amt === undefined) return;
    const amt = Number(t.amt) || 0;
    if (t.kasa === 'unofficial') {
      if (t.typ === 'income') unoffIn += amt; else unoffOut += amt;
    } else {
      if (t.typ === 'income') offBal += amt; else offBal -= amt;
    }
  });
  if (bt) { bt.textContent = fkc(offBal); bt.style.fontSize = '34px'; bt.style.color = offBal>=0?'var(--green)':'var(--red)'; }
  if (bts) bts.textContent = 'oficiální kasa · od ' + fd(new Date(anchor.date));
  if (ui) ui.textContent = '+' + fkc(unoffIn);
  if (uo) uo.textContent = '−' + fkc(unoffOut);
}

function renderToday() {
  const h = gh();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayTx = h.filter(t => new Date(t.ts) >= today);
  const inc = todayTx.filter(t => t.typ === 'income').reduce((s,t) => s+t.amt, 0);
  const exp = todayTx.filter(t => t.typ === 'expense').reduce((s,t) => s+t.amt, 0);
  document.getElementById('today-in').textContent = fkc(inc);
  document.getElementById('today-out').textContent = fkc(exp);
}

function renderRecent() {
  const full = gh();
  const h = full.slice(0, 10);
  const el = document.getElementById('txlist');
  if (h.length === 0) { el.innerHTML = '<div class="empty">Žádné transakce zatím.</div>'; return; }
  el.innerHTML = h.map((t,i) => txHTML(t, i)).join('');
}

function txHTML(t, idx) {
  const icon = t.typ === 'income' ? '↑' : '↓';
  const iconCls = t.typ === 'income' ? 'income' : 'expense';
  const amtCls = t.typ === 'income' ? 'plus' : 'minus';
  const sign = t.typ === 'income' ? '+' : '−';
  const kasaCls = t.kasa === 'official' ? 'official' : 'unofficial';
  const kasaLbl = t.kasa === 'official' ? 'OFICIÁLNÍ' : 'NEOFICIÁLNÍ';
  return `<div class="txitem" onclick="openEditByIndex(${idx})">
    <div class="txitem-icon ${iconCls}">${icon}</div>
    <div class="txitem-info">
      <div class="txitem-cat">${t.cat}</div>
      <div class="txitem-meta">${t.date} ${t.time} · ${t.person}</div>
    </div>
    <div class="txitem-right">
      <div class="txitem-amt ${amtCls}">${sign}${fkc(t.amt)}</div>
      <div class="txitem-kasa ${kasaCls}">${kasaLbl}</div>
    </div>
  </div>`;
}

// ADD FORM
function setTyp(v) {
  formTyp = v; formCat = '';
  document.getElementById('typ-income').className = 'seg-btn' + (v==='income'?' on-income':'');
  document.getElementById('typ-expense').className = 'seg-btn' + (v==='expense'?' on-expense':'');
  document.getElementById('fgrp-kasa').style.display = '';
  formKasa = 'official';
  document.getElementById('kas-official').className='seg-btn on-official';
  document.getElementById('kas-unofficial').className='seg-btn';
  renderCats();
  validateForm();
}

function setKasa(v) {
  formKasa = v;
  document.getElementById('kas-official').className = 'seg-btn' + (v==='official'?' on-official':'');
  document.getElementById('kas-unofficial').className = 'seg-btn' + (v==='unofficial'?' on-unofficial':'');
}

function setCat(v) {
  formCat = v;
  document.querySelectorAll('#cats .cat-btn').forEach(b => b.className = 'cat-btn' + (b.dataset.cat===v?' on':''));
  validateForm();
}

function renderCats() {
  const cats = formTyp === 'income' ? CATS_INCOME : CATS_EXPENSE;
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="cat-btn${formCat===c?' on':''}" data-cat="${c}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}

function validateForm() {
  const amt = parseFloat(document.getElementById('finp-amt').value);
  document.getElementById('bok-add').disabled = !(formCat && amt > 0);
}

function openAdd() {
  formTyp='income'; formKasa='official'; formCat='';
  document.getElementById('typ-income').className='seg-btn on-income';
  document.getElementById('typ-expense').className='seg-btn';
  document.getElementById('kas-official').className='seg-btn on-official';
  document.getElementById('fgrp-kasa').style.display='';
  document.getElementById('kas-unofficial').className='seg-btn';
  document.getElementById('add-who-display').textContent = window._currentPerson || '—';
  document.getElementById('finp-amt').value='';
  document.getElementById('finp-note').value='';
  document.getElementById('bok-add').disabled=true;
  renderCats();
  document.getElementById('ov-add').classList.add('open');
}

async function saveTx() {
  const amt = parseFloat(document.getElementById('finp-amt').value);
  const note = (document.getElementById('finp-note').value||'').trim();
  if (!formCat || !amt) return;
  const now = new Date();
  const rec = {ts:now.toISOString(), date:fd(now), time:ft(now), typ:formTyp, kasa:formKasa, person:window._currentPerson || 'Neznámý', cat:formCat, amt, note};
  document.getElementById('bok-add').disabled = true;
  if (window.saveToFirebase) await window.saveToFirebase(rec);
  else {
    const h = gh(); h.unshift(rec); localStorage.setItem('pk_hist', JSON.stringify(h.slice(0,500)));
    refreshAll();
  }
  const encoded = encodeURIComponent(JSON.stringify(rec));
  const img = new Image();
  img.src = SHEET_WRITE_URL + '?data=' + encoded;
  closeOv('ov-add');
  toast('✓ Transakce uložena');
}

function closeOv(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.ov').forEach(el => el.addEventListener('click', e => { if(e.target===el) el.classList.remove('open'); }));

// EDIT / DETAIL FORM
function openEditByIndex(i) {
  const h = gh();
  if (h[i]) openEdit(h[i]);
}

function openEdit(tx) {
  editTx = tx;
  editTyp = tx.typ; editKasa = tx.kasa || 'official'; editPerson = tx.person; editCat = tx.cat;
  document.getElementById('edit-datetime').textContent = tx.date + ' ' + tx.time;
  document.getElementById('etyp-income').className = 'seg-btn' + (editTyp==='income'?' on-income':'');
  document.getElementById('etyp-expense').className = 'seg-btn' + (editTyp==='expense'?' on-expense':'');
  document.getElementById('ekas-official').className = 'seg-btn' + (editKasa==='official'?' on-official':'');
  document.getElementById('ekas-unofficial').className = 'seg-btn' + (editKasa==='unofficial'?' on-unofficial':'');
  document.getElementById('eper-lukas').className = 'seg-btn' + (editPerson==='Lukáš'?' on-person':'');
  document.getElementById('eper-kolega').className = 'seg-btn' + (editPerson==='Ondra'?' on-person':'');
  document.getElementById('einp-amt').value = tx.amt;
  document.getElementById('einp-note').value = tx.note || '';
  renderECats();
  document.getElementById('ov-edit').classList.add('open');
}

function setETyp(v) {
  editTyp = v; editCat = '';
  document.getElementById('etyp-income').className = 'seg-btn' + (v==='income'?' on-income':'');
  document.getElementById('etyp-expense').className = 'seg-btn' + (v==='expense'?' on-expense':'');
  renderECats();
}

function setEKasa(v) {
  editKasa = v;
  document.getElementById('ekas-official').className = 'seg-btn' + (v==='official'?' on-official':'');
  document.getElementById('ekas-unofficial').className = 'seg-btn' + (v==='unofficial'?' on-unofficial':'');
}

function setEPerson(v) {
  editPerson = v;
  document.getElementById('eper-lukas').className = 'seg-btn' + (v==='Lukáš'?' on-person':'');
  document.getElementById('eper-kolega').className = 'seg-btn' + (v==='Ondra'?' on-person':'');
}

function setECat(v) {
  editCat = v;
  document.querySelectorAll('#ecats .cat-btn').forEach(b => b.className = 'cat-btn' + (b.dataset.cat===v?' on':''));
}

function renderECats() {
  const cats = editTyp === 'income' ? CATS_INCOME : CATS_EXPENSE;
  document.getElementById('ecats').innerHTML = cats.map(c =>
    `<button class="cat-btn${editCat===c?' on':''}" data-cat="${c}" onclick="setECat('${c}')">${c}</button>`
  ).join('');
}

function validateEditForm() {
  // ponecháno pro budoucí použití (zatím se tlačítko nezakazuje, aby šlo uložit i beze změny částky)
}

async function saveEditTx() {
  const amt = parseFloat(document.getElementById('einp-amt').value);
  const note = (document.getElementById('einp-note').value||'').trim();
  if (!editCat || !amt || !editTx) return;
  const updated = { typ: editTyp, kasa: editKasa, person: editPerson, cat: editCat, amt, note };
  if (editTx._id && window.updateInFirebase) await window.updateInFirebase(editTx._id, updated);
  const sheetPayload = Object.assign({}, updated, {date: editTx.date, time: editTx.time});
  const encoded = encodeURIComponent(JSON.stringify(sheetPayload));
  const img = new Image();
  img.src = SHEET_WRITE_URL + '?action=update&ts=' + encodeURIComponent(editTx.ts) + '&data=' + encoded;
  closeOv('ov-edit');
  toast('✓ Transakce upravena');
}

async function deleteEditTx() {
  if (!editTx) return;
  if (!confirm('Smazat tuto transakci?')) return;
  if (editTx._id && window.deleteFromFirebase) await window.deleteFromFirebase(editTx._id);
  const img = new Image();
  img.src = SHEET_WRITE_URL + '?action=delete&ts=' + encodeURIComponent(editTx.ts);
  closeOv('ov-edit');
  toast('🗑️ Transakce smazána');
}

function openHistory() { renderHistory(); document.getElementById('screen-history').classList.add('open'); }
function closeScreen(id) { document.getElementById(id).classList.remove('open'); }

function renderHistory() {
  const h = gh();
  const el = document.getElementById('hlist');
  if (h.length === 0) { el.innerHTML = '<div class="empty">Žádné transakce zatím.</div>'; return; }
  el.innerHTML = h.map((t,i) => {
    const amtCls = t.typ==='income'?'plus':'minus';
    const sign = t.typ==='income'?'+':'−';
    const kasaCls = t.kasa==='official'?'official':'unofficial';
    const kasaLbl = t.kasa==='official'?'OFICIÁLNÍ':'NEOFICIÁLNÍ';
    return `<div class="hitem ${t.typ}" onclick="openEditByIndex(${i})">
      <div class="hhd">
        <div class="hdate2">${t.date} ${t.time} · ${t.person}</div>
        <div class="hamt ${amtCls}">${sign}${fkc(t.amt)}</div>
      </div>
      <div class="hdet2">${t.cat} · <span class="txitem-kasa ${kasaCls}">${kasaLbl}</span></div>
      ${t.note?`<div class="hnote2">${t.note}</div>`:''}
    </div>`;
  }).join('');
}

// STATS
let statDays = 0;
function openStats() { statDays=0; renderStats(); document.getElementById('screen-stats').classList.add('open'); }
function setPeriod(days, btn) {
  statDays=days;
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderStats();
}

function filterTx(days) {
  const h = gh();
  if (days===0) { const t=new Date();t.setHours(0,0,0,0);return h.filter(r=>new Date(r.ts)>=t); }
  return h.filter(r=>new Date(r.ts)>=new Date(Date.now()-days*86400000));
}

function renderStats() {
  const h = filterTx(statDays);
  const inc = h.filter(t=>t.typ==='income').reduce((s,t)=>s+t.amt,0);
  const exp = h.filter(t=>t.typ==='expense').reduce((s,t)=>s+t.amt,0);
  const offInc = h.filter(t=>t.typ==='income'&&t.kasa!=='unofficial').reduce((s,t)=>s+t.amt,0);
  const unoffInc = h.filter(t=>t.typ==='income'&&t.kasa==='unofficial').reduce((s,t)=>s+t.amt,0);
  const offExp = h.filter(t=>t.typ==='expense'&&t.kasa==='official').reduce((s,t)=>s+t.amt,0);
  const unoffExp = h.filter(t=>t.typ==='expense'&&t.kasa==='unofficial').reduce((s,t)=>s+t.amt,0);

  document.getElementById('scards').innerHTML = `
    <div class="sc wide">
      <div class="sclbl">Celkové saldo</div>
      <div class="scval" style="color:${inc-exp>=0?'var(--green)':'var(--red)'}">${fkc(inc-exp)}</div>
      <div class="scsub">Příjmy: ${fkc(inc)} / Výdaje: ${fkc(exp)}</div>
    </div>
    <div class="sc" style="background:var(--official-bg);border-color:var(--official-dim)">
      <div class="sclbl" style="color:var(--official)">🔵 Příjmy ofiko</div>
      <div class="scval" style="color:var(--official)">${fkc(offInc)}</div>
      <div class="scsub">výdaje ofiko: ${fkc(offExp)}</div>
    </div>
    <div class="sc" style="background:var(--unofficial-bg);border-color:var(--unofficial-dim)">
      <div class="sclbl" style="color:var(--unofficial)">🔴 Příjmy neofiko</div>
      <div class="scval" style="color:var(--unofficial)">${fkc(unoffInc)}</div>
      <div class="scsub">výdaje neofiko: ${fkc(unoffExp)}</div>
    </div>`;
}

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg;
  t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2600);
}

window.setTyp = setTyp; window.setKasa = setKasa; window.setCat = setCat; window.validateForm = validateForm;
window.openAdd = openAdd; window.saveTx = saveTx; window.closeOv = closeOv;
window.openEditByIndex = openEditByIndex; window.setETyp = setETyp; window.setEKasa = setEKasa;
window.setEPerson = setEPerson; window.setECat = setECat; window.validateEditForm = validateEditForm;
window.saveEditTx = saveEditTx; window.deleteEditTx = deleteEditTx;
window.openHistory = openHistory; window.closeScreen = closeScreen;
window.openStats = openStats; window.setPeriod = setPeriod;

refreshAll();
</script>
</body>
